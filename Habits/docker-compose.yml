version: '3.8'

services:
  habits-mysql:
    image: mysql:8.0
    container_name: habits-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: habits_db
      MYSQL_USER: habits_user
      MYSQL_PASSWORD: habits_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3310:3306"
    volumes:
      - habits_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  habits_mysql_data:
