spring.application.name=Habits
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3310/habits_db
spring.datasource.username=habits_user
spring.datasource.password=habits_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:daily-dojo-user-service}
jwt.audience=${JWT_AUDIENCE:daily-dojo-api}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
